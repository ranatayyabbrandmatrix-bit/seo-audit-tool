services:
  - type: web
    name: seo-geo-auditor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
